[project]
name = "civic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prayash-in", email = "prayash.in@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "google-genai>=2.18.1",
    "httpx>=0.27.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.9",
    "requests>=2.34.2",
    "uvicorn>=0.30.0",
]

[project.scripts]
civic-ai = "civic_ai:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
